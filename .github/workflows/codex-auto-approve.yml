name: Codex auto-approve (guarded)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  codex_auto_approve:
    # Guardrails: only run for non-fork PRs, and not for drafts
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: CI_CD_PIPELINE

    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (tag v5)
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Optional but often helps: ensures history exists locally
          fetch-depth: 0

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Materialize protected prompt/schema from master branch head
        run: |
          set -euo pipefail
          mkdir -p .codex-protected

          git fetch --no-tags origin master:refs/remotes/origin/master --depth=1

          git show origin/master:.github/codex/prompts/pr-approval.md \
            > .codex-protected/pr-approval.md

          git show origin/master:.github/codex/schemas/pr-approval.schema.json \
            > .codex-protected/pr-approval.schema.json

          git show origin/master:.github/codex/allowlists/auto-approve.json \
            > .codex-protected/auto-approve.json

      - name: Load allowlist from protected base commit
        id: allow
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if jq -e --arg a "$PR_AUTHOR" 'index($a) != null' .codex-protected/auto-approve.json > /dev/null; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build protected run prompt and bounded PR context
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .codex-run

          git --no-pager diff --name-status "$BASE_SHA...$HEAD_SHA" > .codex-run/changed-files.txt
          git --no-pager diff --stat "$BASE_SHA...$HEAD_SHA" > .codex-run/diff-stat.txt
          git --no-pager log --oneline "$BASE_SHA...$HEAD_SHA" > .codex-run/commits.txt

          jq '{
            number: .pull_request.number,
            title: .pull_request.title,
            body: .pull_request.body,
            author: .pull_request.user.login,
            base: { ref: .pull_request.base.ref, sha: .pull_request.base.sha },
            head: { ref: .pull_request.head.ref, sha: .pull_request.head.sha }
          }' "$GITHUB_EVENT_PATH" > .codex-run/pr.json

          gh api "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | {user: .user.login, created_at, body}]' \
            > .codex-run/pr-comments.json

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '[.[] | {user: .user.login, state, submitted_at, body}]' \
            > .codex-run/pr-reviews.json

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | {user: .user.login, path, line, original_line, side, body}]' \
            > .codex-run/pr-review-comments.json

          jq -r '[.pull_request.title // "", .pull_request.body // ""] | join("\n")' "$GITHUB_EVENT_PATH" \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) +([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' \
            | grep -Eo '[0-9]+' \
            | sort -un > .codex-run/linked-issue-numbers.txt || true

          : > .codex-run/linked-issues.jsonl
          : > .codex-run/linked-issue-comments.jsonl
          while IFS= read -r issue_number; do
            test -n "$issue_number" || continue
            gh api "/repos/$GITHUB_REPOSITORY/issues/$issue_number" \
              --jq '{number, title, state, user: .user.login, body}' \
              >> .codex-run/linked-issues.jsonl
            gh api "/repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
              --jq '[.[] | {issue_number: '"$issue_number"', user: .user.login, created_at, body}]' \
              >> .codex-run/linked-issue-comments.jsonl
          done < .codex-run/linked-issue-numbers.txt

          cat > .codex-run/context.md <<EOF
          Repo: $GITHUB_REPOSITORY
          PR: #$PR_NUMBER
          Base: $PR_BASE_REF @ $BASE_SHA
          Head: $PR_HEAD_REF @ $HEAD_SHA

          Generated files:
          - .codex-run/pr.json
          - .codex-run/changed-files.txt
          - .codex-run/diff-stat.txt
          - .codex-run/commits.txt
          - .codex-run/pr-comments.json
          - .codex-run/pr-reviews.json
          - .codex-run/pr-review-comments.json
          - .codex-run/linked-issue-numbers.txt
          - .codex-run/linked-issues.jsonl
          - .codex-run/linked-issue-comments.jsonl

          The full PR diff is intentionally not embedded in this prompt. Inspect it selectively with:
          git --no-pager diff --unified=80 "$BASE_SHA...$HEAD_SHA" -- <path>
          git --no-pager diff --name-only "$BASE_SHA...$HEAD_SHA"
          EOF

          {
            cat .codex-protected/pr-approval.md
            echo ""
            echo "## Workflow-generated context"
            cat .codex-run/context.md
            echo ""
            echo "Use the local repository and generated files to gather only the context needed for the review."
          } > .codex-run/prompt.md

      - name: Run Codex (structured decision using protected prompt)
        id: run_codex
        uses: openai/codex-action@086169432f1d2ab2f4057540b1754d550f6a1189 # v1.4 (tag v1)
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-run/prompt.md
          output-schema-file: .codex-protected/pr-approval.schema.json
          output-file: codex-review.json
          sandbox: read-only
          safety-strategy: drop-sudo

      - name: Parse decision
        id: parse
        run: |
          echo "decision=$(jq -r .decision codex-review.json)" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          jq -r .summary codex-review.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "blocking_issues_json=$(jq -c '.blocking_issues' codex-review.json)" >> "$GITHUB_OUTPUT"

      - name: Approve PR if Codex says APPROVE and author is trusted
        if: steps.parse.outputs.decision == 'APPROVE' && steps.allow.outputs.trusted == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0 (tag v7)
        env:
          SUMMARY: ${{ steps.parse.outputs.summary }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
              body: process.env.SUMMARY || "Codex: approved.",
              commit_id: context.payload.pull_request.head.sha,
            });

      - name: Request changes if Codex says REQUEST_CHANGES
        if: steps.parse.outputs.decision == 'REQUEST_CHANGES'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0 (tag v7)
        env:
          SUMMARY: ${{ steps.parse.outputs.summary }}
          BLOCKING_ISSUES_JSON: ${{ steps.parse.outputs.blocking_issues_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const blockingIssues = JSON.parse(process.env.BLOCKING_ISSUES_JSON || "[]");
            const issueList = blockingIssues.length
              ? blockingIssues.map((issue) => `- ${issue}`).join("\n")
              : "- No blocking issues were returned.";

            const body = [
              process.env.SUMMARY || "Codex: changes requested.",
              "",
              "### Blocking issues",
              issueList,
            ].join("\n");

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "REQUEST_CHANGES",
              body,
              commit_id: context.payload.pull_request.head.sha,
            });
